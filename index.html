<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Inazuma Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
      <div class="calculadora">
        <h1>⚡ Inazuma Calculator ⚡</h1>

        <input type="text"
                id="pantalla"
                readonly>
        <br><br>
        <buttom onclick="agregarNumero('1')">1</buttom>
        <buttom onclick="agregarNumero('2')">2</buttom>
        <buttom onclick="agregarNumero('3')">3</buttom>
        <buttom onclick="agregarNumero('4')">4</buttom>
        <buttom onclick="agregarNumero('5')">5</buttom>
        <buttom onclick="agregarNumero('6')">6</buttom>
        <buttom onclick="agregarNumero('7')">7</buttom>
        <buttom onclick="agregarNumero('8')">8</buttom>
        <buttom onclick="agregarNumero('9')">9</buttom>
        <buttom onclick="agregarNumero('.')">.</buttom>

        <br><br>

        <button onclick="sumar()">+</button>
        <button onclick="restar()">-</button>
        <button onclick="multiplicar()">x</button>
        <button onclick="dividir()">÷</button>

      </div>
        <script src="scripts.js"></script>
    </body>
</html>
