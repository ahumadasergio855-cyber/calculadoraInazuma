<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Inazuma Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
      <div class="calculadora">
        <h1>⚡ Inazuma Calculator ⚡</h1>

        <div class="pantalla-contenedor">
          <button
          class="historial-toggle"
             id="boton-historial"
              onclick="alternarHistorial()">

        </button>
             
         
     </div>

        <!-- HISTORIAL DE OPERACIONES -->

        <div class="historial">

         <h2>📜 Historial</h2>

         <div id="historial-lista">

          </div>
        <input 
        type ="text"
        id="pantalla"
        readonly>
        <br><br>
        

        <br><br>
     <div class="teclado">
        <button class="boton-imagen" 
            onclick="agregarOperador('+')">

            <img src="assets/sumar.png"
            alt="sumar">
        
        </button>
        <button class="boton-imagen" 
            onclick="agregarOperador('-')">

            <img src="assets/restar.png"
            alt="restar">
        
        </button>
        <button class="boton-imagen" 
            onclick="agregarOperador('*')">

            <img src="assets/multiplicar.png"
            alt="multiplicar">
        
        </button>
        <button class="boton-imagen" 
            onclick="agregarOperador('/')">

            <img src="assets/dividir.png"
            alt="dividir">
        
        </button>
        
        <button class="boton-imagen" 
            onclick="raizCuadrada('√')">

            <img src="assets/raiz.png"
            alt="dividir">
        
        </button>
        <button onclick="calcular()">=</button>
        

        
        <button class="boton-imagen" 
            onclick="agregarNumero('1')">

            <img src="assets/1.png"
            alt="1">
        
        </button>

        <button class="boton-imagen"
            onclick="agregarNumero('2')">

            <img src="assets/2.png"
            alt="2">
        
        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('2')">

            <img src="assets/3.png"
            alt="3">
        
        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('4')">

            <img src="assets/4.png"
            alt="4">

        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('5')">

            <img src="assets/5.png"
            alt="5">


        </button>
        <button class="boton-imagen"
        onclick="agregarNumero('6')">

        <img src="assets/6.png"
        alt="6">

        </button>
        <button 
            class="boton-imagen"
            onclick="agregarNumero('7')">

            <img src="assets/7.png" 
            alt="7">
        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('8')">

            <img src="assets/8.png"
            alt="8">

        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('9')">

            <img src="assets/9.png"
            alt="9">

        </button>
        <button class="boton-imagen" 
            onclick="agregarNumero('0')">

            <img src="assets/0.png"
            alt="0">
        </button>
        <button class="boton-imagen"
            onclick="agregarNumero('.')">

            <img src="assets/decimal.png"
            alt=" coma decimal">
            
        </button>

        <button class="boton-imagen"
                    onclick="limpiarHistorial()">
                    
                    <img src="assets/limpiar.png"
                    alt="limpiar">
              </button>
     </div>
        
      

    </div>

        </div>
        <script src="scripts.js"></script>
    </body>
</html>
