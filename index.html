<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Inazuma Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
      <div class="calculadora">
        <h1>⚡ Inazuma Calculator ⚡</h1>

        <div class="pantalla-contenedor">
            <button
            class=""historial-toggle"
            id="boton-historial"
            onclick="alternarHistorial()">
        </button>
        </div>

        <input 
        type ="text"
        id="pantalla"
        readonly>
        <br><br>
        

        <br><br>

        <button onclick="agregarOperador('+')">+</button>
        <button onclick="agregarOperador('-')">-</button>
        <button onclick="agregarOperador('*')">x</button>
        <button onclick="agregarOperador('/')">÷</button>
        <button onclick="raizCuadrada()">√</button>

        <button onclick="calcular()">=</button>
        <button onclick="limpiar()">C</button>

        <button class="numero" onclick="agregarNumero('0')">
        <button onclick="agregarNumero('1')">1</button>
        <button onclick="agregarNumero('2')">2</button>
        <button onclick="agregarNumero('3')">3</button>
        <button onclick="agregarNumero('4')">4</button>
        <button onclick="agregarNumero('5')">5</button>
        <button onclick="agregarNumero('6')">6</button>
        <button onclick="agregarNumero('7')">7</button>
        <button onclick="agregarNumero('8')">8</button>
        <button onclick="agregarNumero('9')">9</button>
        <button onclick="agregarNumero('.')">.</button>    
        </button>


      </div>
      <!-- HISTORIAL DE OPERACIONES -->

        <div class="historial">

         <h2>📜 Historial</h2>

         <div id="historial-lista">

          </div>

              <button onclick="limpiarHistorial()">
                    Borrar historial
              </button>

        </div>
        <script src="scripts.js"></script>
    </body>
</html>
